<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: APM shell (launcher grid of client brands) → per-brand console; brand color re-tints the console accent */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --sunk:#eceeea; --line:#dadfd8; --fg:#161a17; --muted:#5e6862;
  --apm:#0f6b55; --apm-soft:#dcefe8;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c0392b;
  --brand:#0f6b55; --brand-accent:#f7a02c; --brand-soft:color-mix(in srgb,var(--brand) 10%,var(--surface)); --brand-ink:#fff; --brand-viz:var(--brand);
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#171c19; --sunk:#1e2420; --line:#2b332e; --fg:#e8ece9; --muted:#97a39c;
  --apm:#4cc2a0; --apm-soft:#173229; --good:#4cc27a; --warn:#e0a84a; --bad:#ef6b5e;
  --brand-soft:color-mix(in srgb,var(--brand) 30%,var(--surface)); --brand-viz:color-mix(in srgb,var(--brand) 40%,#ffffff); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#171c19; --sunk:#1e2420; --line:#2b332e; --fg:#e8ece9; --muted:#97a39c;
  --apm:#4cc2a0; --apm-soft:#173229; --good:#4cc27a; --warn:#e0a84a; --bad:#ef6b5e;
  --brand-soft:color-mix(in srgb,var(--brand) 30%,var(--surface)); --brand-viz:color-mix(in srgb,var(--brand) 40%,#ffffff); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;font-weight:500}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.brand-tile:focus-visible{outline:2px solid var(--apm);outline-offset:2px}
.btn-primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn-apm{background:var(--apm);color:#fff;border-color:transparent}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.ar{direction:rtl;unicode-bidi:plaintext}
.sample-flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.pill.hero{background:var(--brand-accent);color:#1d1606}

/* Shell header */
.shell-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.apm-mark{display:flex;align-items:center;gap:10px}
.apm-logo{width:34px;height:34px;border-radius:8px;background:var(--apm);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.tagline{font-size:12px;color:var(--muted)}

/* Launcher */
.launch-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.brand-tile{all:unset;cursor:pointer;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:190px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.brand-tile:hover{transform:translateY(-2px);border-color:var(--tile)}
.brand-tile .band{position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--tile) 70%,var(--tile2,var(--tile)) 70%)}
.tile-logo{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--tile)}
.tile-logo img{width:100%;height:100%;object-fit:contain}
.tile-stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.tile-stats b{display:block;color:var(--fg);font-family:var(--f-mono);font-size:14px;font-weight:500}
.add-tile{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--muted);min-height:190px}
.empty{padding:32px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}

/* Brand console */
.console-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 22px;border-radius:16px;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--brand) 78%,#ffffff) 0%,var(--brand) 45%,color-mix(in srgb,var(--brand) 70%,#000) 100%);color:var(--brand-ink);border-bottom:5px solid var(--brand-accent);margin-bottom:16px;position:relative;overflow:hidden}
.console-head .eyebrow,.console-head .muted{color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.console-head .accent-word{color:var(--brand-accent)}
.console-logo{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--brand);flex-shrink:0}
.console-logo img{width:100%;height:100%;object-fit:contain}
.console-title{flex:1;min-width:200px;display:grid;gap:4px}
.console-title h1{color:var(--brand-ink);font-size:30px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tab{border:none;background:none;border-radius:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand-accent)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi{display:grid;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart{width:100%;height:auto;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-cell i{display:block;height:6px;border-radius:3px;background:var(--brand-viz)}

/* Offer rules */
.rule{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.rule.off{opacity:.6}
.rule .who{font-weight:600;font-size:15px}
.rule .then{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.arrow{color:var(--muted)}
.chip{padding:3px 10px;border-radius:6px;background:var(--brand-soft);color:var(--fg);font-weight:500;border:1px solid color-mix(in srgb,var(--brand) 25%,transparent)}
.chip.time{background:var(--sunk);border-color:var(--line)}
.rule-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rule-actions{display:flex;gap:6px;align-items:start}
.rule-actions button{padding:5px 10px;font-size:12px}
.editor{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));padding:14px;border:1px solid var(--brand);border-radius:10px;background:var(--brand-soft)}
.editor .full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Engine */
.sim{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px}
@media (max-width:760px){.sim{grid-template-columns:1fr}}
.basket{display:flex;flex-wrap:wrap;gap:6px}
.basket button{padding:4px 10px;font-size:12px;border-radius:999px}
.basket button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.decision{display:grid;gap:10px}
.dec-item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px;border-radius:10px;background:var(--sunk)}
.dec-item .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-family:var(--f-display);font-size:13px}
.dec-item.upsell .ic{background:var(--apm);color:#fff}
.ai-out{white-space:pre-wrap;padding:14px;border-radius:10px;background:var(--sunk);min-height:60px;font-size:13.5px;line-height:1.7;unicode-bidi:plaintext}
.ai-presets{display:flex;flex-wrap:wrap;gap:6px}
.ai-presets button{font-size:12.5px;padding:6px 11px;border-radius:999px}
.notice{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;background:var(--surface)}
code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="shell-top">
    <div class="apm-mark">
      <div class="apm-logo">APM</div>
      <div><div style="font-family:var(--f-display);font-weight:700;font-size:16px">Apployalty Performance Management</div>
      <div class="tagline">Spend less · Sell more — client loyalty console</div></div>
    </div>
    <span id="connState" class="pill">Connecting…</span>
  </header>
  <main id="app">
    <div class="empty">Loading your signed brands…</div>
  </main>
</div>

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function slug(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9؀-ۿ]+/g,"-").replace(/^-|-$/g,"") || ("brand-"+Date.now()); }
function initials(n){ return String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function inkFor(hex){ const h=(hex||"#000").replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>160 ? "#161a17" : "#ffffff"; }
function brand(){ return brands.find(b=>b.id===current); }
function logoHTML(b, cls){ const u=b.logoUrl||SNAP_LOGO[b.id]; return u ? `<img src="${esc(u)}" alt="${esc(b.name)} logo">` : esc(initials(b.name)); }
function _unused(b){ return b.logoUrl ? `<img src="${esc(b.logoUrl)}" alt="${esc(b.name)} logo">` : esc(initials(b.name)); }

/* ---------- Offer engine (the 4 Pizza King rules are data, not code) ---------- */
// condition types: first_visit | days (array of 0-6) | before_hour (n)
function matchRules(b, s){
  const out=[];
  for(const r of (b.offers||[])){
    if(!r.active) continue;
    const c=r.condition||{};
    let ok=false;
    if(c.type==="first_visit") ok = s.visits===1;
    else if(c.type==="days") ok = (c.days||[]).includes(s.day);
    else if(c.type==="before_hour") ok = s.hour < (c.hour??15);
    if(ok) out.push(r);
  }
  return out.sort((a,b)=>(a.priority??9)-(b.priority??9));
}
function sendTiming(r, s){
  const c=r.condition||{}; const d=DAYS[s.day];
  if(r.timing) return r.timing.replace("{day}", d);
  if(c.type==="days") return "Next " + d;
  return "Next visit";
}
function upsellFor(b, basket){
  const menu=b.menu||[]; if(!menu.length) return [];
  const inBasket=new Set(basket);
  const cats=new Set(menu.filter(m=>inBasket.has(m.name)).map(m=>m.category));
  return menu.filter(m=>!inBasket.has(m.name))
    .map(m=>{
      let score=(m.attach||0)*1 + (m.hero?18:0) + (m.margin||30)*0.4;
      if(cats.has(m.category)) score-=25;           // don't push a second main if one is there
      if(!basket.length && m.category!=="Pizza" && m.category!=="Fold") score-=10;
      return {...m, score};
    }).sort((a,b)=>b.score-a.score).slice(0,3);
}
function basketValue(b, basket){ const p=Object.fromEntries((b.menu||[]).map(m=>[m.name,m.price])); return basket.reduce((s,n)=>s+(p[n]||0),0); }

/* ---------- Charts (SVG, one scale each) ---------- */
function areaChart(vals, labels){
  const W=640,H=200,pl=44,pr=12,pt=12,pb=26; if(!vals?.length) return "";
  const max=Math.max(...vals)*1.1, min=0;
  const x=i=>pl+(W-pl-pr)*i/(vals.length-1), y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  const ticks=4; let g="";
  for(let i=0;i<=ticks;i++){const v=max*i/ticks; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`;}
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`M${x(0)},${y(0)} L${pts.replace(/ /g," L")} L${x(vals.length-1)},${y(0)} Z`;
  const lab=labels.map((l,i)=> i%2===0||i===labels.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  const last=vals.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly revenue trend">${g}<path d="${area}" fill="var(--brand-viz)" fill-opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--brand-viz)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(vals[last])}" r="5" fill="var(--brand-accent)" stroke="var(--surface)" stroke-width="2"/>${lab}</svg>`;
}
function barChart(vals, labels, highlight=()=>false, aria=""){
  const W=640,H=190,pl=40,pr=8,pt=10,pb=26; if(!vals?.length) return "";
  const max=Math.max(...vals)*1.1||1; const n=vals.length; const bw=(W-pl-pr)/n;
  const y=v=>pt+(H-pt-pb)*(1-v/max); let g="";
  for(let i=0;i<=3;i++){const v=max*i/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`;}
  const bars=vals.map((v,i)=>`<rect x="${pl+i*bw+bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${highlight(i)?"var(--brand-accent)":"var(--brand-viz)"}" fill-opacity="${highlight(i)?1:.3}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect><text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}${bars}</svg>`;
}

function condText(c){
  if(!c) return "";
  if(c.type==="first_visit") return "First order ever";
  if(c.type==="days") return "Ordered on " + (c.days||[]).map(d=>DAYS[d]).join(", ");
  if(c.type==="before_hour") return `Ordered before ${c.hour}:00`;
  return "";
}

function drawDecision(b){
  const rules=matchRules(b, simState); const ups=upsellFor(b, simState.basket); const val=basketValue(b, simState.basket);

  const segLine = rules.length? "" : `<div class="notice">No loyalty rule matches this customer. They still get the upsell below.</div>`;
  $("#decision").innerHTML = segLine + rules.map((r,i)=>`<div class="dec-item"><div class="ic">${i+1}</div><div style="display:grid;gap:4px;min-width:0">
      <div><span class="eyebrow">${i===0?"Send this offer":"Also qualifies"}</span></div>
      <div class="ar" style="font-weight:600">${esc(r.offerAr||r.offer)}</div>

      <div class="row small"><span class="chip time">Send: ${esc(sendTiming(r, simState))}</span><span class="pill">${esc(r.channel||"Online")}</span></div></div></div>`).join("")
    + (ups.length?`<div class="dec-item upsell"><div class="ic">+</div><div style="display:grid;gap:6px;min-width:0"><span class="eyebrow">Upsell at checkout</span>

}

function brandContext(b){
  const slim={name:b.name, dataIsSample:!!b.isSample, period:b.dataLabel||"last 30 days", kpis:b.kpis, ordersByWeekday:Object.fromEntries((b.dow||[]).map((v,i)=>[DAYS[i],v])), ordersByHour:b.hours, segments:b.segments,
    menu:(b.menu||[]).map(m=>({name:m.name,category:m.category,priceEGP:m.price,hero:!!m.hero,shareOfOrdersPct:m.share,addOnRatePct:m.attach})),
    offerRules:(b.offers||[]).map(r=>({segment:r.segmentAr||r.segment, qualifies:condText(r.condition), offer:r.offerAr||r.offer, sendWhen:r.timing, channel:r.channel, active:r.active}))};
  return JSON.stringify(slim);
}
const PRESETS={
  topline:"Give a 30-day plan to grow topline revenue. Use the segments, offer rules, hero items and order timing. For each action: which segment, which offer or upsell, when to send it, and the expected effect on AOV or order count (show your arithmetic from the data).",
  upsell:"Propose 4 upsell bundles built around the hero items, priced in EGP. For each: which segment to show it to, at what moment (checkout, push, day/time), and why the data supports it.",
  msgs:"Write one short Egyptian-Arabic push/SMS message for each active offer rule (max 120 characters each, friendly, clear call to action). Label each with its segment.",
  timing:"For each offer rule, recommend the best day and hour to send it, based on orders by weekday and by hour. Explain briefly.",
  risk:"Review the active offer rules and flag any that may cut margin or cannibalize full-price orders. Suggest a safer variant for each."
};
function setupAI(b){
  const out=$("#aiOut"), askBtn=$("#aiAsk"), stopBtn=$("#aiStop");
  if(!sample){ out.innerHTML='<span class="muted">The AI assistant works when this page is open in Claude. The offer engine above works everywhere.</span>'; askBtn.disabled=true; $("#aiPresets").querySelectorAll("button").forEach(x=>x.disabled=true); return; }
  const run=async(q)=>{
    if(!q) return;
    aiCtl?.abort(); aiCtl=new AbortController();
    askBtn.disabled=true; stopBtn.hidden=false; out.textContent="Thinking…";
    const prompt=`You are APM's loyalty and upsell analyst for the restaurant brand below (Egypt, prices in EGP). APM's positioning: "Spend less, sell more" — the right offer to the right customer at the right time, with zero wasted spend.
Brand data (JSON):\n${brandContext(b)}\n
${b.isSample?"Note: these figures are sample data, say so briefly once.\n":""}Answer in the same language as the question. Be concrete and short: use bullet points, real item names and EGP numbers from the data. Plain text, no markdown headers or tables.
Question: ${q}`;
    try{ const {text}=await sample(prompt,{signal:aiCtl.signal, onText:({text})=>{out.textContent=text;}}); out.textContent=text; }
    catch(e){ if(e.code==="aborted"){ out.textContent=(e.text||out.textContent)+"\n\n(Stopped)"; }
      else if(e.code==="not_granted"){ out.textContent="Claude access wasn't allowed for this page. Reload and allow it to use the assistant."; }
      else if(e.code==="rate_limited"){ out.textContent="Too many questions at once. Wait a moment and ask again."; }
      else { out.textContent=(e.text?e.text+"\n\n":"")+"The assistant couldn't finish: "+(e.message||e.code); } }
    finally{ askBtn.disabled=false; stopBtn.hidden=true; }
  };
  askBtn.onclick=()=>run($("#aiQ").value.trim());
  $("#aiQ").onkeydown=e=>{ if(e.key==="Enter") run($("#aiQ").value.trim()); };
  stopBtn.onclick=()=>aiCtl?.abort();
  $("#aiPresets").querySelectorAll("button").forEach(x=>x.onclick=()=>{ $("#aiQ").value=x.textContent; run(PRESETS[x.dataset.p]); });
}

/* ---------- CSV + order summarizer ---------- */
function parseCSV(text){
  const lines=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===","){row.push(f);f="";} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); lines.push(row); row=[]; f=""; } else f+=ch; }
  if(f||row.length){row.push(f); lines.push(row);}
  const head=(lines.shift()||[]).map(h=>h.trim().toLowerCase().replace(/^﻿/,""));
  return lines.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??""])));
}
function summarizeOrders(rows, b, webUsers){
  const orders=rows.map(r=>{ const d=new Date((r.date||"").trim()+"T"+((r.time||"12:00").trim().padStart(5,"0"))); return {c:(r.customer_id||"").trim(), d, total:Number(String(r.total).replace(/[^0-9.]/g,""))||0, items:(r.items||"").split("|").map(s=>s.trim()).filter(Boolean)}; }).filter(o=>o.c && !isNaN(o.d));
  if(!orders.length) throw new Error("no valid rows — need customer_id, date, time, total");
  orders.sort((a,c)=>a.d-c.d);
  const end=orders[orders.length-1].d, ms30=30*864e5;
  const cur=orders.filter(o=>end-o.d<ms30), prev=orders.filter(o=>end-o.d>=ms30 && end-o.d<2*ms30);
  const sum=a=>a.reduce((s,o)=>s+o.total,0);
  const byCust={}; orders.forEach(o=>(byCust[o.c]??=[]).push(o));
  const curCust=new Set(cur.map(o=>o.c));
  const repeat=[...curCust].filter(c=>byCust[c].length>1).length;
  const rev=sum(cur), aov=rev/(cur.length||1), pRev=sum(prev), pAov=pRev/(prev.length||1);
  const ch=(a,c)=>c?Math.round(1000*(a-c)/c)/10:null;
  const dow=[0,0,0,0,0,0,0]; const hours={}; cur.forEach(o=>{dow[o.d.getDay()]++; const h=o.d.getHours(); hours[h]=(hours[h]||0)+1;});
  const hoursSorted=Object.fromEntries(Object.keys(hours).map(Number).sort((a,c)=>a-c).map(h=>[String(h),hours[h]]));
  // weekly trend (last 12 weeks)
  const wk={}; orders.forEach(o=>{ const w=Math.floor((end-o.d)/(7*864e5)); if(w<12) wk[w]=(wk[w]||0)+o.total; });
  const labels=[], values=[]; for(let w=11;w>=0;w--){ const dt=new Date(end-w*7*864e5); labels.push((dt.getMonth()+1)+"/"+dt.getDate()); values.push(Math.round(wk[w]||0)); }
  // segments from the brand's own rules, applied to each customer's latest order
  const segments=(b.offers||[]).map(r=>{ const members=[...curCust].filter(c=>{ const list=byCust[c]; const last=list[list.length-1]; return matchRules({offers:[{...r,active:true}]},{visits:list.length, day:last.d.getDay(), hour:last.d.getHours()}).length; });
    const ords=members.flatMap(c=>byCust[c].filter(o=>end-o.d<ms30)); return {key:r.segmentKey||slug(r.segment||r.segmentAr), name:r.segment, nameAr:r.segmentAr, size:members.length, aov:Math.round(sum(ords)/(ords.length||1))}; });
  // item shares + add-on rate (share of orders containing item alongside something else)
  const cnt={}, add={}; cur.forEach(o=>{ const u=[...new Set(o.items)]; u.forEach(it=>{cnt[it]=(cnt[it]||0)+1; if(u.length>1) add[it]=(add[it]||0)+1;}); });
  const menu=(b.menu||[]).map(m=>({...m, share:Math.round(1000*(cnt[m.name]||0)/(cur.length||1))/10, attach:Math.round(1000*(add[m.name]||0)/(cur.length||1))/10}));
  const offers=(b.offers||[]).map(r=>({...r, segmentKey:r.segmentKey||slug(r.segment||r.segmentAr)}));
  const first=cur[0].d, fmtD=d=>d.toISOString().slice(0,10);
  return { isSample:false, dataLabel:`Orders ${fmtD(first)} → ${fmtD(end)}`,
    kpis:{revenue30:Math.round(rev), orders30:cur.length, aov:Math.round(aov), activeCustomers:curCust.size, repeatRate:Math.round(1000*repeat/(curCust.size||1))/10, webUsers:webUsers??b.kpis?.webUsers??null,
      deltas:{revenue:ch(rev,pRev), orders:ch(cur.length,prev.length), aov:ch(aov,pAov)}},
    dow, hours:hoursSorted, trend:{labels, values}, segments, menu, offers };
}

async function saveField(field, value, msg){
  const b=brand(); if(!db){ toast("Saving needs the page open in Claude"); return; }

(async()=>{
  const conn=$("#connState");

  claude.use("assets").then(a=>{ assets=a; if(current&&tab==="data") renderConsole(); });
  db=await claude.use("db");
  if(!db){ conn.textContent="View only"; return; }
  conn.textContent="Live"; conn.classList.add("on");
  const wanted=(location.hash||"").replace("#","");
  let first=true;
  db.collection("brands").orderBy("name").onSnapshot(snap=>{
    const live=snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
    brands = live.length ? live : SNAP_BRANDS.map(b=>({...b}));
    if(first){ first=false; if(wanted && brands.some(b=>b.id===wanted)) current=wanted; }
    const active=document.activeElement; const typing=active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA"||active.tagName==="SELECT") && active.type!=="file";
    if(typing && current && (tab==="engine")) return;   // don't wipe the question box
    render();
  }, e=>{ conn.textContent="View only"; toast("Lost the live connection. Reload the page."); });
})();
})();
